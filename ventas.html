<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>Ventas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container">
        <nav class="nav-main">
            <img src="img/logo.png" alt="Logo de Inventrack" class="nav-logo"
              width="450" height="350" style="height: 120px; width: auto;">
            <ul class="nav-menu">
                <li>
                    <a href="index.html">Dashboard</a>
                </li>
                <li>
                    <a href="inventario.html">Inventario</a>
                </li>
                <li>
                    <a href="ventas.html">Ventas</a>
                </li>
            </ul>
        </nav>
        <hr>
<main class="main-content">

    <header class="page-header">
        <h1>Punto de Venta</h1>
    </header>

    <div class="form-container">

        <form id="form-venta" class="form-grid">

            <div class="form-group">
                <label>Producto</label>
                <select id="select-producto" class="form-control" required>
                    <option value="">Seleccione un producto...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" id="venta-cantidad"
                       class="form-control" min="1" required>
            </div>

            <div class="form-group" style="justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">
                    Completar Venta
                </button>
            </div>

        </form>

    </div>

    <div class="table-container">

        <h2>Historial de Ventas</h2>

        <table class="custom-table">

            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="tabla-ventas"></tbody>

        </table>

    </div>

</main>
    </div>
    <script type="module" src="js/ventas.js"></script>
</body>
</html>

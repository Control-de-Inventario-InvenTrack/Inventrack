<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container">
        <nav class="nav-main">
            <img src="img/logo.png" alt="Logo de Inventrack" class="nav-logo"
              width="450" height="350" style="height: 120px; width: auto;">
            <ul class="nav-menu">
                <li>
                    <a href="index.html">Dashboard</a>
                </li>
                <li>
                    <a href="inventario.html">Inventario</a>
                </li>
                <li>
                    <a href="ventas.html">Ventas</a>
                </li>
            </ul>
        </nav>
        <hr>
<main class="main-content">
    <header class="page-header">
        <h1>Administración de Productos</h1>
    </header>

    <div class="form-container">
        <form id="form-producto" class="form-grid">

            <input type="hidden" id="prod-id">

            <div class="form-group">
                <label>SKU</label>
                <input type="text" id="prod-sku" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="prod-nombre" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Precio ($)</label>
                <input type="number" id="prod-precio" step="0.01" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Stock Initial</label>
                <input type="number" id="prod-stock" class="form-control" required>
            </div>

            <div class="form-group" style="justify-content: flex-end;">
                <button type="submit" class="btn btn-primary" id="btn-guardar">
                    Guardar Producto
                </button>
            </div>

        </form>
    </div>
    <div class="table-container">
        <table class="custom-table">

            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tabla-productos"></tbody>

        </table>
    </div>
</main>
    </div>
<script type="module" src="js/inventario.js"></script>

</body>
</html>

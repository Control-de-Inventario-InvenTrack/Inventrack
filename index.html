<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <!-- Personalización de CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <aside class="sidebar">
        <img src="img/logo.png" alt="Logo Inventrack" class="sidebar-logo">
        <ul class="nav-links">
            <li><a href="index.html" class="active">Dashboard</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="ventas.html">Ventas</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1>Resumen General</h1>
        </header>

        <section class="kpi-grid">
            <div class="kpi-card">
                <h3>Total de Productos</h3>
                <div class="value" id="kpi-total-productos">0</div>
            </div>
            <div class="kpi-card">
                <h3>Valor Inventario</h3>
                <div class="value" id="kpi-valor-inventario">C$0.00</div>
            </div>
            <div class="kpi-card">
                <h3>Ventas Totales</h3>
                <div class="value" id="kpi-total-ventas">C$0.00</div>
            </div>
            <div class="kpi-card">
                <h3>Stock Crítico</h3>
                <div class="value" id="kpi-stock-critico">0</div>
            </div>
        </section>
    </main>

    <script type="module" src="js/analitica.js"></script>
</body>
</html>
